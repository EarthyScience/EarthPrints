name: Branch protection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-protection.yml
  workflow_dispatch:

permissions:
  administration: write

jobs:
  apply-ruleset:
    name: Apply main branch ruleset
    runs-on: ubuntu-latest
    steps:
      - name: Sync branch protection ruleset
        uses: actions/github-script@v7
        with:
          script: |
            const RULESET_NAME = "Protect main";
            const REQUIRED_CHECKS = ["Lint and build"];

            const { owner, repo } = context.repo;

            const rulesetPayload = {
              name: RULESET_NAME,
              target: "branch",
              enforcement: "active",
              conditions: {
                ref_name: {
                  include: ["~DEFAULT_BRANCH"],
                  exclude: [],
                },
              },
              rules: [
                {
                  type: "pull_request",
                  parameters: {
                    required_approving_review_count: 0,
                    dismiss_stale_reviews_on_push: false,
                    require_code_owner_review: false,
                    require_last_push_approval: false,
                    required_review_thread_resolution: false,
                  },
                },
                { type: "deletion" },
                { type: "non_fast_forward" },
                {
                  type: "required_status_checks",
                  parameters: {
                    strict_required_status_checks_policy: true,
                    do_not_enforce_on_create: false,
                    required_status_checks: REQUIRED_CHECKS.map((context) => ({
                      context,
                    })),
                  },
                },
              ],
            };

            const { data: rulesets } = await github.request(
              "GET /repos/{owner}/{repo}/rulesets",
              {
                owner,
                repo,
                headers: { "X-GitHub-Api-Version": "2022-11-28" },
              },
            );

            const existing = rulesets.find((ruleset) => ruleset.name === RULESET_NAME);

            if (existing) {
              await github.request("PUT /repos/{owner}/{repo}/rulesets/{ruleset_id}", {
                owner,
                repo,
                ruleset_id: existing.id,
                ...rulesetPayload,
                headers: { "X-GitHub-Api-Version": "2022-11-28" },
              });
              core.info(`Updated ruleset "${RULESET_NAME}" (id: ${existing.id}).`);
              return;
            }

            const { data: created } = await github.request(
              "POST /repos/{owner}/{repo}/rulesets",
              {
                owner,
                repo,
                ...rulesetPayload,
                headers: { "X-GitHub-Api-Version": "2022-11-28" },
              },
            );

            core.info(`Created ruleset "${RULESET_NAME}" (id: ${created.id}).`);
